name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - apps/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/android.yml
  pull_request:
    paths:
      - apps/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.1.12297006

jobs:
  apk:
    name: APK (Android, Fire TV)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools ndk;27.1.12297006'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Firma de release (opcional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > apps/desktop/src-tauri/gen/android/release.jks
          cat > apps/desktop/src-tauri/gen/android/keystore.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
      - name: APK de depuración (instalable por sideload)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: pnpm --filter @orivue/desktop tauri android build --apk --debug --target aarch64 --target armv7 --target x86_64
      - name: APK de release
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: pnpm --filter @orivue/desktop tauri android build --apk --target aarch64 --target armv7 --target x86_64
      - name: Renombrar artefactos
        run: |
          mkdir -p out
          cp apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk out/orivue-universal-debug.apk
          RELEASE=$(ls apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          case "$RELEASE" in
            *unsigned*) cp "$RELEASE" out/orivue-universal-release-unsigned.apk ;;
            *) cp "$RELEASE" out/orivue-universal-release.apk ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: orivue-android
          path: out/*.apk
          retention-days: 14
      - name: Publicar en la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: out/*.apk
