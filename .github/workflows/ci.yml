name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Formato
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck
      - name: Tests unitarios e integración
        run: pnpm test
      - name: Build web y paquetes
        run: pnpm build

  rust:
    name: rust (proxy y plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Formato Rust
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
      - name: Clippy del proxy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -p orivue-stream-proxy --all-targets -- -D warnings
      - name: Tests del proxy
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml -p orivue-stream-proxy

  e2e:
    name: e2e (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar Chromium de Playwright
        run: pnpm --filter @orivue/web exec playwright install --with-deps chromium
      - name: Tests end-to-end
        run: pnpm test:e2e
      - name: Subir informe si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
