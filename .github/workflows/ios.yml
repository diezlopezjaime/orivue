name: iOS

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - apps/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/ios.yml
  pull_request:
    paths:
      - apps/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/ios.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: iOS (simulador, sin firma)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: brew install xcodegen
      - run: pnpm install --frozen-lockfile
      - name: Generar proyecto Xcode
        run: pnpm --filter @orivue/desktop tauri ios init --ci
      - name: Ajustar Info.plist (ATS para loopback y HTTP)
        run: node apps/desktop/scripts/patch-ios-project.mjs
      - name: Compilar para simulador
        working-directory: apps/desktop/src-tauri/gen/apple
        run: |
          PROJECT=$(ls -d *.xcodeproj | head -1)
          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; s=json.load(sys.stdin)["project"]["schemes"]; print([x for x in s if x.endswith("_iOS")][0])')
          echo "Proyecto $PROJECT, esquema $SCHEME"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          APP=$(find build/Build/Products -name '*.app' -maxdepth 2 | head -1)
          mkdir -p ../../../../../out
          ditto -c -k --keepParent "$APP" ../../../../../out/orivue-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: orivue-ios-simulator
          path: out/orivue-ios-simulator.zip
          retention-days: 14
      - name: Publicar en la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: out/orivue-ios-simulator.zip
