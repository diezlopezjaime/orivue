[package]
name = "orivue-desktop"
version = "0.2.0"
description = "Local-first Orivue application for desktop, Android, Fire TV and iOS"
authors = ["Jaime and contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.84"

[workspace]
members = ["crates/*"]

[lib]
name = "orivue_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orivue-stream-proxy = { path = "crates/stream-proxy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-orivue-native = { path = "crates/tauri-plugin-orivue-native" }
